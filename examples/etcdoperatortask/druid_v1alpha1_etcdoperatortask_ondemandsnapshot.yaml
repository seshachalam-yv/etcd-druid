apiVersion: druid.gardener.cloud/v1alpha1
kind: EtcdOperatorTask
metadata:
  name: on-demand-snapshot-task
  namespace: default
spec:
  etcdRef:
    name: etcd-test
    namespace: default
  config:
    onDemandSnapshotConfig:
      type: full #values: full, delta
      timeoutSeconds: 60
      isFinal: true
    
  ttlSecondsAfterFinished: 60
